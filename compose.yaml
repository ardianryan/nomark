services:
  nomark:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NOMARK_TRUSTED_PROXIES: "172.16.0.0/12"
      NOMARK_NMT_URL: "http://nomark-nmt:8001"
      NOMARK_MEDIA_URL: "http://nomark-media:8002"
    networks: [default, nmt-internal, media-internal]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 95s

  nomark-nmt:
    build: ./nmt-service
    restart: unless-stopped
    init: true
    networks: [nmt-internal]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  nomark-media:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    restart: unless-stopped
    init: true
    networks: [media-internal]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777,noexec,nosuid,nodev"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s

networks:
  nmt-internal:
    internal: true
  media-internal:
    internal: true
