services:
  nomark:
    environment:
      NOMARK_MEDIA_URL: http://nomark-media:8002
    networks:
      - default
      - media-internal
  nomark-media:
    image: registry.gitlab.com/ardianryan/nomark/media:0.1.0-alpha.8
    restart: unless-stopped
    init: true
    networks: [media-internal]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777,noexec,nosuid,nodev"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
networks:
  media-internal:
    internal: true
