services:
  nomark:
    image: registry.gitlab.com/ardianryan/nomark:0.1.0-alpha.3
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NOMARK_TRUSTED_PROXIES: "172.16.0.0/12"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 95s
