# Use inside the NoMark server block on 10.1.0.18, after installing the
# sibling nginx-cloudflare-realip.conf at the path below. Merge these directives
# into the existing location if aaPanel already manages it.
include /etc/nginx/nomark-cloudflare-realip.conf;
location / {
    proxy_pass http://10.1.0.9:8120;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace any client-supplied chain; do not append $proxy_add_x_forwarded_for.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 100s;
    client_max_body_size 21m;
}
