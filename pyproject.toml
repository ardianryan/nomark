[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nomark"
version = "0.1.0a7"
description = "A browser-managed workspace for cleaning hidden Unicode and document metadata."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["nomark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
